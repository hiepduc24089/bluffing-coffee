memory_limit = 512M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
date.timezone = UTC
expose_php = Off

; Source code được bake vào image và container luôn restart khi deploy,
; nên tắt validate_timestamps để opcache không phải stat file mỗi request.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
