# Compose dùng trên server production (VPS Ubuntu, xem docs/deployment.md).
#
# Chạy bằng:
#   docker compose -f docker-compose.prod.yml \
#     --env-file .env.production --env-file .env.deploy <lệnh>
#
# `--env-file` cần cho phần nội suy ${...} bên dưới, còn `env_file:` là để
# đẩy biến vào trong container.
#
# .env.deploy chỉ chứa một dòng `APP_IMAGE=...` — tag image đang chạy, do
# workflow deploy ghi đè mỗi lần deploy. Rollback = sửa dòng đó rồi `up -d`.
#
# Project name khác với compose dev (`bluffing-coffee`) để volume và container
# của hai môi trường không đè lên nhau khi chạy chung một máy.
name: bluffing-coffee-prod

# Docker mặc định KHÔNG giới hạn log container -> đầy disk là MySQL chết trước.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    # Bình thường image được CI build sẵn và đẩy lên GHCR, server chỉ pull.
    # `build:` giữ lại cho trường hợp phải build tay ngay trên server
    # (bootstrap lần đầu, hoặc CI hỏng): `$COMPOSE build app`.
    #
    # Context là thư mục gốc repo (`..`) chứ không phải `backend/`, vì image
    # chứa cả frontend đã build. Xem đầu file backend/Dockerfile.prod.
    build:
      context: ..
      dockerfile: backend/Dockerfile.prod
    image: ${APP_IMAGE:-bluffing-coffee-app:latest}
    container_name: bluffing_coffee_prod_app
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # File upload (Storage::disk('public')) phải sống ngoài image.
      - app_storage:/app/storage
      # Chứng chỉ Let's Encrypt của Caddy — mất volume này là phải xin lại cert.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - bluffing_coffee_prod

  mysql:
    image: mysql:8.4
    container_name: bluffing_coffee_prod_mysql
    restart: unless-stopped
    logging: *default-logging
    # Không mở port ra host: DB chỉ truy cập được từ trong network của compose.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - bluffing_coffee_prod

  redis:
    image: redis:7.4-alpine
    container_name: bluffing_coffee_prod_redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - bluffing_coffee_prod

volumes:
  app_storage:
  caddy_data:
  caddy_config:
  mysql_data:
  redis_data:

networks:
  bluffing_coffee_prod:
    driver: bridge
