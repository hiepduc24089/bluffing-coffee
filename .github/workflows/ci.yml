name: CI

on:
  pull_request:
    branches: [main]
  # Được `deploy.yml` gọi lại làm cổng chặn trước khi build/deploy.
  # Vì vậy KHÔNG khai `push: main` ở đây — nếu khai, mỗi lần push lên main sẽ
  # chạy test hai lần (một lần độc lập, một lần do deploy gọi).
  workflow_call:

# Gộp `github.workflow` vào group để lần chạy do deploy gọi không hủy lần chạy
# độc lập của cùng một ref (và ngược lại).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bluffing_coffee_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pcntl, pdo_mysql, redis, zip
          coverage: none

      - name: Lấy đường dẫn cache của Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Chuẩn bị .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # Biến môi trường thật được ưu tiên hơn giá trị trong .env,
      # nên không cần sửa file .env để trỏ về MySQL của CI.
      #
      # Bỏ qua khi chưa có test: `phpunit.xml` vẫn khai `tests/Unit` và
      # `tests/Feature`, mà thư mục không tồn tại thì `php artisan test` thoát
      # với mã 2 và làm đỏ cả pipeline deploy. Điều kiện dưới đây tự bật lại
      # ngay khi có file `*Test.php` đầu tiên — không cần nhớ sửa lại workflow.
      - name: Chạy test
        run: |
          if [ -n "$(find tests -name '*Test.php' -print -quit 2>/dev/null)" ]; then
            php artisan test
          else
            echo "Chưa có test nào trong backend/tests — bỏ qua."
          fi
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: bluffing_coffee_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Yarn 4 được kích hoạt qua corepack theo field `packageManager`.
      - run: corepack enable

      - run: yarn install --immutable

      - run: yarn typecheck

      - run: yarn build
